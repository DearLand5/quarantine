<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Тополиная, 14 — мобильный 3D-хоррор о карантине в многоэтажке.">
  <title>Тополиная, 14</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@300;500&family=PT+Mono&display=swap">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/hud.css">
  <link rel="stylesheet" href="styles/phone.css">
  <link rel="stylesheet" href="styles/menus.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="fx-grain" class="fx-layer"></div>
    <div id="fx-vignette" class="fx-layer"></div>
    <div id="fx-damage" class="fx-layer"></div>
    <div id="ui-root"></div>
    <div id="fade" class="fade-layer"></div>

    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="boot-title">ТОПОЛИНАЯ, 14</div>
        <div class="boot-sub">карантин</div>
        <div id="boot-status" class="boot-status">Загрузка…</div>
        <button id="boot-start" class="boot-start" hidden>Нажмите, чтобы начать</button>
        <div class="boot-hint">Лучше играть в наушниках, в горизонтальной ориентации.</div>
      </div>
    </div>
    <noscript><div class="boot"><div class="boot-inner">Для игры нужен JavaScript.</div></div></noscript>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
